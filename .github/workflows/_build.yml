name: Build

on:
  workflow_call:
    inputs:
      environment:
        description: "Deployment environment (playground|development|release)"
        required: true
        type: string
      tags:
        description: "Newline-separated metadata-action tags"
        required: true
        type: string

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    strategy:
      matrix:
        include:
          - name: server
            image: ghcr.io/${{ github.repository_owner }}/mcp-sandboxd
            dockerfile: docker/server.Dockerfile
          - name: sandbox
            image: ghcr.io/${{ github.repository_owner }}/mcp-sandboxd-sandbox
            dockerfile: docker/sandbox.Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (${{ matrix.name }})
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: ${{ inputs.tags }}

      - name: Build and push (${{ matrix.name }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (e.g. 1.2.3)"
        required: true
        type: string

jobs:
  test:
    name: Test
    uses: ./.github/workflows/_test.yml

  build:
    name: Build
    needs: test
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build.yml
    with:
      environment: release
      tags: |
        type=raw,value=${{ needs.test.outputs.short_sha }}
        type=raw,value=latest
        type=raw,value=${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
